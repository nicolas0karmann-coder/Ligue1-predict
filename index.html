<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foot — Prédictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loadingBar" class="loading-bar"></div>
<div class="floodlight"></div>

<header class="masthead">
  <div class="masthead-inner">
    <p class="eyebrow">Pronostics statistiques — modèle Dixon-Coles</p>
    <div id="leagueTabs" class="league-tabs" role="tablist" aria-label="Choix du championnat"></div>
    <h1 id="leagueTitle">LIGUE 1<span class="accent-dot">.</span></h1>
    <div id="viewTabs" class="view-tabs" role="tablist" aria-label="Choix de la vue">
      <button id="viewTabJournee" class="view-tab active" data-view="journee" role="tab"
              aria-selected="true" aria-controls="matchdayNav matches">Journée</button>
      <button id="viewTabClassement" class="view-tab" data-view="classement" role="tab"
              aria-selected="false" aria-controls="ranking">Classement</button>
    </div>
    <div id="matchdayNav" class="matchday-nav">
      <label for="matchdaySelect" class="matchday-eyebrow">Journée</label>
      <div class="select-wrap">
        <select id="matchdaySelect" aria-label="Choisir la journée"></select>
      </div>
    </div>
  </div>
</header>

<main id="app">
  <div id="statusMsg" class="status-msg">Chargement des prédictions…</div>
  <div id="matches" class="matches" role="tabpanel" aria-labelledby="viewTabJournee"></div>
  <div id="ranking" class="ranking hidden" role="tabpanel" aria-labelledby="viewTabClassement"></div>
</main>

<footer class="site-footer">
  <p>Modèle Dixon-Coles (Poisson bivarié) entraîné sur l'historique de chaque championnat depuis 2009 · Calendrier : fixturedownload.com</p>
  <p class="disclaimer">À titre informatif — le football garde sa part d'imprévisible.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
